<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Panel</title>
  <style>
    :root{
      --bg:#0f172a;
      --panel:#111827;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --accent:#38bdf8;
      --success:#22c55e;
      --danger:#ef4444;
      --warning:#f59e0b;
      --border:rgba(148,163,184,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:linear-gradient(180deg,#0f172a 0%,#111827 100%);
      color:var(--text);
      min-height:100vh;
    }
    .container{max-width:1800px;margin:0 auto;padding:20px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .title{font-size:30px;font-weight:bold}
    .topbar a{text-decoration:none;color:white;background:var(--accent);padding:10px 14px;border-radius:10px;font-weight:bold}
    .grid{display:grid;grid-template-columns:1fr;gap:16px}
    @media (min-width:1150px){.grid{grid-template-columns:1fr 1fr}}
    .card{
      background:rgba(17,24,39,.94);
      border:1px solid var(--border);
      border-radius:16px;
      padding:16px;
      box-shadow:0 8px 20px rgba(0,0,0,.24);
    }
    h2{margin-top:0}
    label{display:block;margin-bottom:8px;font-weight:bold}
    input, textarea, select{
      width:100%;
      border-radius:12px;
      border:1px solid var(--border);
      background:#0b1220;
      color:var(--text);
      padding:12px;
      font-size:15px;
    }
    select:disabled, input:disabled, textarea:disabled{opacity:.55;cursor:not-allowed}
    textarea{min-height:160px;resize:vertical;line-height:1.5}
    .row,.row-3{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
    @media (min-width:760px){.row{grid-template-columns:1fr 1fr}}
    @media (min-width:980px){.row-3{grid-template-columns:1fr 1fr 1fr}}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
    button{
      border:none;border-radius:10px;padding:10px 14px;
      font-size:14px;font-weight:bold;cursor:pointer
    }
    .primary{background:var(--accent);color:#08111f}
    .success{background:var(--success);color:#04130a}
    .danger{background:var(--danger);color:white}
    .secondary{background:#334155;color:white}
    .warning{background:var(--warning);color:#111827}
    .message{margin-top:14px;min-height:24px;font-weight:bold}
    .ok{color:var(--success)} .err{color:var(--danger)} .info{color:var(--accent)}
    .small{color:var(--muted);font-size:14px;line-height:1.6}
    .help-box,.note-box,.warn-box{
      margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.6
    }
    .help-box{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.18);color:#cbd5e1}
    .note-box{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.18);color:#dcfce7}
    .warn-box{background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.22);color:#fde68a}
    .json-output{min-height:340px;font-family:Consolas, monospace}
    .set-list{display:grid;gap:10px;max-height:760px;overflow:auto;margin-top:10px}
    .set-item{
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.06);
      border-radius:12px;padding:12px
    }
    .set-header{
      display:grid;
      grid-template-columns:1fr 1fr 1fr 1fr 170px 190px 140px 190px auto;
      gap:8px;margin-bottom:10px
    }
    @media (max-width:1600px){.set-header{grid-template-columns:1fr}}
    .pair-box{
      background:rgba(255,255,255,.03);
      border-radius:10px;padding:10px;margin-top:10px;overflow:auto
    }
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th, td{border-bottom:1px solid rgba(255,255,255,.08);padding:8px;vertical-align:top}
    th{text-align:left;color:#cbd5e1;font-size:14px}
    .pair-input{min-width:220px}
    .filter-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
    @media (max-width:900px){.filter-bar{grid-template-columns:1fr}}
    .login-overlay{
      position:fixed;inset:0;background:rgba(2,6,23,.96);
      display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px
    }
    .login-box{
      width:min(460px, 100%);
      background:#111827;border:1px solid rgba(255,255,255,.1);
      border-radius:18px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.45)
    }
    .login-error{margin-top:12px;min-height:22px;color:#fca5a5;font-weight:bold}
    #teacherPanel{display:none}
  </style>
</head>
<body>
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h2 data-i18n="login_title">Teacher panel access</h2>
      <div class="small" data-i18n="login_subtitle">Enter the password to open the panel.</div>
      <div style="margin-top:14px;">
        <label for="teacherPassword" data-i18n="password">Password</label>
        <input id="teacherPassword" type="password" />
      </div>
      <div class="actions">
        <button class="primary" id="loginBtn" data-i18n="enter">Enter</button>
        <a href="index.html" style="text-decoration:none;">
          <button type="button" class="secondary" data-i18n="back_to_game">Back to game</button>
        </a>
      </div>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <div id="teacherPanel">
    <div class="container">
      <div class="topbar">
        <div>
          <div class="title" data-i18n="panel_title">Teacher Panel</div>
          <div class="small" data-i18n="panel_subtitle">The "Letters only" option is available only for sets in Letters mode.</div>
        </div>
        <a href="index.html" data-i18n="open_student_game">Open student game</a>
      </div>

      <div class="grid">
        <div class="card">
          <h2 data-i18n="section1_title">1. Global settings (default)</h2>

          <div class="row">
            <div>
              <label for="gameTitle" data-i18n="game_title">Game title</label>
              <input id="gameTitle" type="text" value="Translation Game" />
            </div>
            <div>
              <label for="difficulty" data-i18n="difficulty">Difficulty</label>
              <select id="difficulty">
                <option value="easy" data-i18n="easy">Easy</option>
                <option value="medium" selected data-i18n="medium">Medium</option>
                <option value="hard" data-i18n="hard">Hard</option>
              </select>
            </div>
          </div>

          <div class="row-3">
            <div>
              <label for="defaultClassLabel" data-i18n="default_class">Default class / group</label>
              <input id="defaultClassLabel" type="text" value="5A" />
            </div>
            <div>
              <label for="sourceLanguageLabel" data-i18n="source_language">Source language</label>
              <input id="sourceLanguageLabel" type="text" value="English" />
            </div>
            <div>
              <label for="targetLanguageLabel" data-i18n="target_language">Target language</label>
              <input id="targetLanguageLabel" type="text" value="Polski" />
            </div>
          </div>

          <div class="actions">
            <button class="warning" id="swapAllLanguagesBtn" data-i18n="swap_languages_all">Swap languages in all sets</button>
          </div>

          <div class="row-3">
            <div>
              <label for="spawnRate" data-i18n="tile_spawn_time">Tile spawn timing</label>
              <select id="spawnRate">
                <option value="1500" data-i18n="slow">Slow</option>
                <option value="1100" selected data-i18n="normal">Normal</option>
                <option value="800" data-i18n="fast">Fast</option>
              </select>
            </div>
            <div>
              <label for="timerSeconds" data-i18n="timer">Timer</label>
              <select id="timerSeconds">
                <option value="0" data-i18n="no_timer">No timer</option>
                <option value="30" data-i18n="sec_30">30 seconds</option>
                <option value="45" selected data-i18n="sec_45">45 seconds</option>
                <option value="60" data-i18n="sec_60">60 seconds</option>
                <option value="90" data-i18n="sec_90">90 seconds</option>
              </select>
            </div>
            <div>
              <label for="maxMistakes" data-i18n="max_mistakes">Maximum mistakes</label>
              <select id="maxMistakes">
                <option value="0" data-i18n="no_limit">No limit</option>
                <option value="3">3</option>
                <option value="5" selected>5</option>
                <option value="10">10</option>
              </select>
            </div>
          </div>

          <div class="row-3">
            <div>
              <label for="randomOrder" data-i18n="sentence_order">Sentence order</label>
              <select id="randomOrder">
                <option value="false" selected data-i18n="in_order">In order</option>
                <option value="true" data-i18n="random">Random</option>
              </select>
            </div>
            <div>
              <label for="autoNextSeconds" data-i18n="auto_next">Auto next</label>
              <select id="autoNextSeconds">
                <option value="0" data-i18n="disabled">Disabled</option>
                <option value="2" data-i18n="sec2">2 seconds</option>
                <option value="3" selected data-i18n="sec3">3 seconds</option>
                <option value="5" data-i18n="sec5">5 seconds</option>
              </select>
            </div>
            <div>
              <label for="defaultDistractorCount" data-i18n="default_distractor_count">Default distractor count</label>
              <select id="defaultDistractorCount">
                <option value="0" data-i18n="none">None</option>
                <option value="2">2</option>
                <option value="4" selected>4</option>
                <option value="6">6</option>
                <option value="8">8</option>
              </select>
            </div>
          </div>

          <div class="row-3">
            <div>
              <label for="defaultDistractorMode" data-i18n="default_distractor_mode">Default distractor type</label>
              <select id="defaultDistractorMode">
                <option value="auto" selected data-i18n="auto">Automatic</option>
                <option value="lettersOnly" data-i18n="letters_only">Letters only</option>
                <option value="material" data-i18n="from_material">Only from material</option>
              </select>
            </div>
            <div>
              <label for="punctuationMode" data-i18n="punctuation">Punctuation</label>
              <select id="punctuationMode">
                <option value="auto" selected data-i18n="automatic">Automatic</option>
                <option value="tiles" data-i18n="as_tiles">As tiles</option>
              </select>
            </div>
            <div>
              <label for="studentNameMode" data-i18n="student_name_required">Student name required</label>
              <select id="studentNameMode">
                <option value="true" selected data-i18n="yes">Yes</option>
                <option value="false" data-i18n="no">No</option>
              </select>
            </div>
          </div>

          <div class="row-3">
            <div>
              <label for="showSetPicker" data-i18n="show_set_picker">Show set picker at start</label>
              <select id="showSetPicker">
                <option value="true" selected data-i18n="yes">Yes</option>
                <option value="false" data-i18n="no">No</option>
              </select>
            </div>
            <div>
              <label for="allowHint" data-i18n="hint">Hint</label>
              <select id="allowHint">
                <option value="true" selected data-i18n="yes">Yes</option>
                <option value="false" data-i18n="no">No</option>
              </select>
            </div>
            <div>
              <label for="allowSolution" data-i18n="show_solution">Show solution</label>
              <select id="allowSolution">
                <option value="true" data-i18n="yes">Yes</option>
                <option value="false" selected data-i18n="no">No</option>
              </select>
            </div>
          </div>

          <div class="row-3">
            <div>
              <label for="showTranslationInstruction" data-i18n="translation_instruction">Translation instruction</label>
              <select id="showTranslationInstruction">
                <option value="true" selected data-i18n="yes">Yes</option>
                <option value="false" data-i18n="no">No</option>
              </select>
            </div>
            <div>
              <label for="soundEnabled" data-i18n="sound">Sound</label>
              <select id="soundEnabled">
                <option value="true" selected data-i18n="yes">Yes</option>
                <option value="false" data-i18n="no">No</option>
              </select>
            </div>
          </div>

          <div class="note-box" id="globalInfoBox"></div>
          <div class="warn-box" id="globalWarnBox"></div>
        </div>

        <div class="card">
          <h2 data-i18n="section2_title">2. New set</h2>

          <div class="row">
            <div>
              <label for="newSetId" data-i18n="set_id">Set ID</label>
              <input id="newSetId" type="text" />
            </div>
            <div>
              <label for="newSetName" data-i18n="set_name">Set name</label>
              <input id="newSetName" type="text" />
            </div>
          </div>

          <div class="row">
            <div>
              <label for="newSetClassLabel" data-i18n="class_group">Class / group</label>
              <input id="newSetClassLabel" type="text" />
            </div>
            <div>
              <label for="newSetTheme" data-i18n="theme">Theme</label>
              <input id="newSetTheme" type="text" />
            </div>
          </div>

          <div class="row-3">
            <div>
              <label for="newSetBuildMode" data-i18n="build_mode">Build mode</label>
              <select id="newSetBuildMode">
                <option value="words" data-i18n="build_words">Build with words</option>
                <option value="letters" data-i18n="build_letters">Build with letters</option>
              </select>
            </div>
            <div>
              <label for="newSetUseOwnDistractors" data-i18n="distractor_settings">Distractor settings</label>
              <select id="newSetUseOwnDistractors">
                <option value="false" selected data-i18n="inherit_global">Inherit global</option>
                <option value="true" data-i18n="use_own">Use own</option>
              </select>
            </div>
            <div>
              <label for="newSetDistractorCount" data-i18n="distractor_count">Distractor count</label>
              <select id="newSetDistractorCount">
                <option value="0" data-i18n="none">None</option>
                <option value="2">2</option>
                <option value="4" selected>4</option>
                <option value="6">6</option>
                <option value="8">8</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div>
              <label for="newSetDistractorMode" data-i18n="distractor_type">Distractor type</label>
              <select id="newSetDistractorMode">
                <option value="auto" selected data-i18n="auto">Automatic</option>
                <option value="lettersOnly" data-i18n="letters_only">Letters only</option>
                <option value="material" data-i18n="from_material">Only from material</option>
              </select>
            </div>
          </div>

          <div class="note-box" id="newSetBehaviorInfo"></div>
          <div class="warn-box" id="newSetModeInfo"></div>

          <label for="newSetPairs" style="margin-top:12px;" data-i18n="sentence_pairs">Sentence pairs</label>
          <textarea id="newSetPairs"></textarea>

          <div class="actions">
            <button class="primary" id="addSetBtn" data-i18n="add_set">Add set</button>
            <button class="danger" id="clearNewSetBtn" data-i18n="clear_fields">Clear fields</button>
          </div>

          <div class="message info" id="message"></div>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <h2 data-i18n="section3_title">3. Set filters</h2>
        <div class="filter-bar">
          <div>
            <label for="filterClassLabel" data-i18n="filter_class">Filter by class / group</label>
            <input id="filterClassLabel" type="text" />
          </div>
          <div>
            <label for="filterTheme" data-i18n="filter_theme">Filter by theme</label>
            <input id="filterTheme" type="text" />
          </div>
          <div>
            <label>&nbsp;</label>
            <button class="secondary" id="clearFiltersBtn" style="width:100%;" data-i18n="clear_filters">Clear filters</button>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <h2 data-i18n="section4_title">4. Translation sets</h2>
        <div class="actions">
          <button class="success" id="addEmptySetBtn" data-i18n="add_empty_set">Add empty set</button>
          <button class="secondary" id="sortSetsBtn" data-i18n="sort_sets">Sort sets A-Z</button>
          <button class="danger" id="clearSetsBtn" data-i18n="remove_all_sets">Remove all sets</button>
        </div>

        <div id="setList" class="set-list"></div>
        <div id="stats" class="small" style="margin-top:10px;"></div>
      </div>

      <div class="card" style="margin-top:16px;">
        <h2 data-i18n="section5_title">5. JSON preview</h2>
        <textarea id="jsonOutput" class="json-output" readonly></textarea>

        <div class="actions">
          <button class="primary" id="previewBtn" data-i18n="refresh_json">Refresh JSON</button>
          <button class="success" id="downloadBtn" data-i18n="download_json">Download sentences.json</button>
          <button class="secondary" id="copyBtn" data-i18n="copy_json">Copy JSON</button>
          <button class="secondary" id="importBtn" data-i18n="import_json">Import existing JSON</button>
          <input type="file" id="importFile" accept=".json,application/json" style="display:none" />
        </div>
      </div>
    </div>
  </div>

    function detectLanguage(){

      if(lang.startsWith("en")) return "en";
      return "en";
    }

    function setMessage(text, type = "info"){
      message.textContent = text;
      message.className = "message " + type;
    }

    function sanitizeId(value){
      return String(value).trim().toLowerCase().replace(/\s+/g, "_").replace(/[^a-z0-9_-]/g, "");
    }

    function cleanText(text){ return String(text).trim(); }

    function parsePairsFromTextarea(text){
      return text.split("\n")
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => {
          const parts = line.split("=");
          if(parts.length < 2) return null;
          return { source: cleanText(parts[0]), target: cleanText(parts.slice(1).join("=")) };
        })
        .filter(item => item && item.source && item.target);
    }

    function escapeHtmlAttr(text){
      return String(text)
        .replace(/&/g, "&amp;").replace(/"/g, "&quot;")
        .replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function filteredSets(){
      return sets.filter(set => {
        const classOk = !filterClassLabel.value.trim() ||
          String(set.classLabel || "").toLowerCase().includes(filterClassLabel.value.trim().toLowerCase());
        const themeOk = !filterTheme.value.trim() ||
          String(set.theme || "").toLowerCase().includes(filterTheme.value.trim().toLowerCase());
        return classOk && themeOk;
      });
    }

    function setModeOptionsForSelect(selectEl, buildMode){
      const lettersOption = selectEl.querySelector('option[value="lettersOnly"]');
      if(!lettersOption) return;
      if(buildMode === "words"){
        lettersOption.disabled = true;
        if(selectEl.value === "lettersOnly") selectEl.value = "auto";
      } else {
        lettersOption.disabled = false;
      }
    }

    function updateNewSetOwnFieldsState(){
      const useOwn = newSetUseOwnDistractors.value === "true";
      const buildMode = newSetBuildMode.value;

      setModeOptionsForSelect(newSetDistractorMode, buildMode);
      newSetDistractorCount.disabled = !useOwn;
      newSetDistractorMode.disabled = !useOwn;

      if(useOwn){
        newSetBehaviorInfo.innerHTML = t("newset_own_info");
        newSetBehaviorInfo.className = "note-box";
      } else {
        newSetBehaviorInfo.innerHTML = t("newset_inherit_info");
        newSetBehaviorInfo.className = "help-box";
      }

      if(buildMode === "words"){
        newSetModeInfo.innerHTML = t("newset_words_mode_info");
        newSetModeInfo.className = "warn-box";
      } else {
        newSetModeInfo.innerHTML = t("newset_letters_mode_info");
        newSetModeInfo.className = "note-box";
      }
    }

    function translateDistractorMode(mode){
      if(mode === "lettersOnly") return t("letters_only");
      if(mode === "material") return t("from_material");
      return t("auto");
    }

    function getSetBehaviorInfoHtml(set){
      const useOwn = !!set.useOwnDistractors;
      if(useOwn){
        return `
          <div class="note-box">
            <strong>${t("set_own_info")}</strong><br>
            ${t("distractor_count")}: <strong>${Number(set.distractorCount ?? 0)}</strong><br>
            ${t("distractor_type")}: <strong>${translateDistractorMode(set.distractorMode || "auto")}</strong>
          </div>
        `;
      }
      return `
        <div class="help-box">
          <strong>${t("set_inherit_info")}</strong><br>
          ${t("uses_global_count")}: <strong>${Number(defaultDistractorCount.value)}</strong><br>
          ${t("uses_global_type")}: <strong>${translateDistractorMode(defaultDistractorMode.value)}</strong>
        </div>
      `;
    }

    function getSetModeInfoHtml(set){
      if(set.buildMode === "words"){
        return `<div class="warn-box">${t("set_mode_words_info")}</div>`;
      }
      return `<div class="note-box">${t("set_mode_letters_info")}</div>`;
    }

    function updateStatsLabel(){
      stats.textContent = `${t("set_count")}: ${filteredSets().length} / ${sets.length}`;
    }

    function unlockTeacherPanel(){
      loginOverlay.style.display = "none";
      teacherPanel.style.display = "block";
      teacherPassword.value = "";
      loginError.textContent = "";
    }

    function tryLogin(){
      if(teacherPassword.value === TEACHER_PASSWORD){
        unlockTeacherPanel();
      } else {
        loginError.textContent = t("login_error");
        teacherPassword.select();
      }
    }

    loginBtn.addEventListener("click", tryLogin);
    teacherPassword.addEventListener("keydown", (e) => {
      if(e.key === "Enter") tryLogin();
    });

    function swapLanguageLabels(){
      const oldSource = sourceLanguageLabel.value;
      sourceLanguageLabel.value = targetLanguageLabel.value;
      targetLanguageLabel.value = oldSource;
    }

    function swapLanguagesInSet(index){
      if(!sets[index] || !Array.isArray(sets[index].pairs)) return;
      sets[index].pairs = sets[index].pairs.map(pair => ({ source: pair.target, target: pair.source }));
      renderSets();
      updateJsonPreview();
      setMessage(t("languages_swapped_set"), "ok");
    }

    function swapLanguagesInAllSets(){
      sets = sets.map(set => ({
        ...set,
        pairs: (set.pairs || []).map(pair => ({ source: pair.target, target: pair.source }))
      }));
      swapLanguageLabels();
      renderSets();
      updateJsonPreview();
      setMessage(t("languages_swapped_all"), "ok");
    }

    function renderSets(){
      setList.innerHTML = "";
      const visibleSets = filteredSets();

      if(visibleSets.length === 0){
        setList.innerHTML = `<div class="small">${t("no_matching_sets")}</div>`;
      }

      visibleSets.forEach(set => {
        const realIndex = sets.findIndex(s => s.id === set.id && s.name === set.name);
        const rowsHtml = (set.pairs || []).map((pair, pairIndex) => `
          <tr>
            <td><input class="pair-input" type="text" value="${escapeHtmlAttr(pair.source)}" data-pair-field="source" data-set-index="${realIndex}" data-pair-index="${pairIndex}"></td>
            <td><input class="pair-input" type="text" value="${escapeHtmlAttr(pair.target)}" data-pair-field="target" data-set-index="${realIndex}" data-pair-index="${pairIndex}"></td>
            <td><button class="danger" data-action="removePair" data-set-index="${realIndex}" data-pair-index="${pairIndex}">${t("remove")}</button></td>
          </tr>
        `).join("");

        const useOwn = !!set.useOwnDistractors;
        const disableLettersOnly = set.buildMode === "words";

        const box = document.createElement("div");
        box.className = "set-item";
        box.innerHTML = `
          <div class="set-header">
            <input type="text" value="${escapeHtmlAttr(set.id)}" placeholder="${t("set_id")}" data-field="id" data-index="${realIndex}">
            <input type="text" value="${escapeHtmlAttr(set.name)}" placeholder="${t("set_name")}" data-field="name" data-index="${realIndex}">
            <input type="text" value="${escapeHtmlAttr(set.classLabel || "")}" placeholder="${t("class_group")}" data-field="classLabel" data-index="${realIndex}">
            <input type="text" value="${escapeHtmlAttr(set.theme || "")}" placeholder="${t("theme")}" data-field="theme" data-index="${realIndex}">
            <select data-field="buildMode" data-index="${realIndex}">
              <option value="words" ${set.buildMode === "words" ? "selected" : ""}>${t("build_words")}</option>
              <option value="letters" ${set.buildMode === "letters" ? "selected" : ""}>${t("build_letters")}</option>
            </select>
            <select data-field="useOwnDistractors" data-index="${realIndex}">
              <option value="false" ${!useOwn ? "selected" : ""}>${t("inherit_global")}</option>
              <option value="true" ${useOwn ? "selected" : ""}>${t("use_own")}</option>
            </select>
            <select data-field="distractorCount" data-index="${realIndex}" ${!useOwn ? "disabled" : ""}>
              <option value="0" ${Number(set.distractorCount ?? 4) === 0 ? "selected" : ""}>${t("none")}</option>
              <option value="2" ${Number(set.distractorCount ?? 4) === 2 ? "selected" : ""}>2</option>
              <option value="4" ${Number(set.distractorCount ?? 4) === 4 ? "selected" : ""}>4</option>
              <option value="6" ${Number(set.distractorCount ?? 4) === 6 ? "selected" : ""}>6</option>
              <option value="8" ${Number(set.distractorCount ?? 4) === 8 ? "selected" : ""}>8</option>
            </select>
            <select data-field="distractorMode" data-index="${realIndex}" ${!useOwn ? "disabled" : ""}>
              <option value="auto" ${set.distractorMode === "auto" ? "selected" : ""}>${t("auto")}</option>
              <option value="lettersOnly" ${set.distractorMode === "lettersOnly" ? "selected" : ""} ${disableLettersOnly ? "disabled" : ""}>${t("letters_only")}</option>
              <option value="material" ${set.distractorMode === "material" ? "selected" : ""}>${t("from_material")}</option>
            </select>
            <button class="danger" data-action="removeSet" data-index="${realIndex}">${t("remove")}</button>
          </div>

          ${getSetBehaviorInfoHtml(set)}
          ${getSetModeInfoHtml(set)}

          <div class="pair-box">
            <table>
              <thead>
                <tr>
                  <th>${t("source_sentence")}</th>
                  <th>${t("target_translation")}</th>
                  <th>${t("action")}</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml || `<tr><td colspan="3" class="small">${t("no_pairs")}</td></tr>`}
              </tbody>
            </table>
            <div class="actions">
              <button class="success" data-action="addPair" data-index="${realIndex}">${t("add_pair")}</button>
              <button class="secondary" data-action="duplicateSet" data-index="${realIndex}">${t("duplicate")}</button>
              <button class="warning" data-action="swapSetLanguages" data-index="${realIndex}">${t("swap_languages")}</button>
              <button class="secondary" data-action="upSet" data-index="${realIndex}">${t("move_up")}</button>
              <button class="secondary" data-action="downSet" data-index="${realIndex}">${t("move_down")}</button>
            </div>
          </div>
        `;
        setList.appendChild(box);
      });

      bindSetEvents();
      updateStatsLabel();
    }

    function bindSetEvents(){
      setList.querySelectorAll("[data-field]").forEach(input => {
        input.addEventListener("input", e => {
          const i = Number(e.target.dataset.index);
          const field = e.target.dataset.field;
          let value = e.target.value;

          if(field === "id") value = sanitizeId(value);
          if(field === "distractorCount") value = Number(value);
          if(field === "useOwnDistractors") value = value === "true";

          if(field === "buildMode"){
            sets[i][field] = value;
            if(value === "words" && sets[i].distractorMode === "lettersOnly"){
              sets[i].distractorMode = "auto";
            }
            renderSets();
            updateJsonPreview();
            return;
          }

          sets[i][field] = value;
          renderSets();
          updateJsonPreview();
        });
      });

      setList.querySelectorAll("[data-pair-field]").forEach(input => {
        input.addEventListener("input", e => {
          const setIndex = Number(e.target.dataset.setIndex);
          const pairIndex = Number(e.target.dataset.pairIndex);
          const field = e.target.dataset.pairField;
          sets[setIndex].pairs[pairIndex][field] = e.target.value;
          updateJsonPreview();
        });
      });

      setList.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", e => {
          const action = e.target.dataset.action;
          const i = Number(e.target.dataset.index);
          const setIndex = Number(e.target.dataset.setIndex);
          const pairIndex = Number(e.target.dataset.pairIndex);

          if(action === "removeSet"){
            sets.splice(i, 1);
          } else if(action === "duplicateSet"){
            sets.splice(i + 1, 0, JSON.parse(JSON.stringify(sets[i])));
            sets[i + 1].id = sets[i + 1].id + "_copy";
            sets[i + 1].name = sets[i + 1].name + " copy";
          } else if(action === "swapSetLanguages"){
            swapLanguagesInSet(i);
            return;
          } else if(action === "upSet" && i > 0){
            [sets[i - 1], sets[i]] = [sets[i], sets[i - 1]];
          } else if(action === "downSet" && i < sets.length - 1){
            [sets[i + 1], sets[i]] = [sets[i], sets[i + 1]];
          } else if(action === "addPair"){
            sets[i].pairs.push({ source: "", target: "" });
          } else if(action === "removePair"){
            sets[setIndex].pairs.splice(pairIndex, 1);
          }

          renderSets();
          updateJsonPreview();
        });
      });
    }

    function getConfigData(){
      const preparedSets = sets
        .map(set => ({
          id: sanitizeId(set.id),
          name: cleanText(set.name),
          classLabel: cleanText(set.classLabel || ""),
          theme: cleanText(set.theme || ""),
          buildMode: set.buildMode === "letters" ? "letters" : "words",
          useOwnDistractors: !!set.useOwnDistractors,
          distractorCount: Number(set.distractorCount ?? 4),
          distractorMode: set.distractorMode || "auto",
          pairs: (set.pairs || [])
            .map(pair => ({ source: cleanText(pair.source), target: cleanText(pair.target) }))
            .filter(pair => pair.source && pair.target)
        }))
        .filter(set => set.id && set.name && set.pairs.length > 0);

      if(preparedSets.length === 0){
        setMessage(t("add_one_valid_set"), "err");
        return null;
      }

      return {
        title: cleanText(gameTitle.value) || "Translation Game",
        settings: {
          difficulty: difficulty.value,
          defaultClassLabel: cleanText(defaultClassLabel.value) || "",
          spawnRate: Number(spawnRate.value),
          timerSeconds: Number(timerSeconds.value),
          maxMistakes: Number(maxMistakes.value),
          randomOrder: randomOrder.value === "true",
          autoNextSeconds: Number(autoNextSeconds.value),
          soundEnabled: soundEnabled.value === "true",
          studentNameMode: studentNameMode.value === "true",
          showSetPicker: showSetPicker.value === "true",
          allowHint: allowHint.value === "true",
          allowSolution: allowSolution.value === "true",
          showTranslationInstruction: showTranslationInstruction.value === "true",
          sourceLanguageLabel: cleanText(sourceLanguageLabel.value) || "English",
          targetLanguageLabel: cleanText(targetLanguageLabel.value) || "Polski",
          defaultDistractorCount: Number(defaultDistractorCount.value),
          defaultDistractorMode: defaultDistractorMode.value,
          punctuationMode: punctuationMode.value
        },
        sets: preparedSets
      };
    }

    function updateJsonPreview(){
      const data = getConfigData();
      if(!data){
        jsonOutput.value = "";
        return;
      }
      jsonOutput.value = JSON.stringify(data, null, 2);
    }

    function addSet(id, name, classLabel, theme, buildMode, useOwnDistractors, distractorCount, distractorMode, pairs){
      if(buildMode === "words" && distractorMode === "lettersOnly"){
        distractorMode = "auto";
      }

      sets.push({
        id: sanitizeId(id),
        name: cleanText(name),
        classLabel: cleanText(classLabel || ""),
        theme: cleanText(theme || ""),
        buildMode: buildMode === "letters" ? "letters" : "words",
        useOwnDistractors: !!useOwnDistractors,
        distractorCount: Number(distractorCount ?? 4),
        distractorMode: distractorMode || "auto",
        pairs: (pairs || []).map(pair => ({
          source: cleanText(pair.source),
          target: cleanText(pair.target)
        })).filter(pair => pair.source && pair.target)
      });
      renderSets();
      updateJsonPreview();
    }

    function applyData(data){
      gameTitle.value = data.title || "Translation Game";

      const s = data.settings || {};
      difficulty.value = s.difficulty || "medium";
      defaultClassLabel.value = s.defaultClassLabel || "";
      spawnRate.value = String(s.spawnRate ?? 1100);
      timerSeconds.value = String(s.timerSeconds ?? 45);
      maxMistakes.value = String(s.maxMistakes ?? 5);
      randomOrder.value = String(!!s.randomOrder);
      autoNextSeconds.value = String(s.autoNextSeconds ?? 3);
      soundEnabled.value = String(s.soundEnabled ?? true);
      studentNameMode.value = String(s.studentNameMode ?? true);
      showSetPicker.value = String(s.showSetPicker ?? true);
      allowHint.value = String(s.allowHint ?? true);
      allowSolution.value = String(s.allowSolution ?? false);
      showTranslationInstruction.value = String(s.showTranslationInstruction ?? true);
      sourceLanguageLabel.value = s.sourceLanguageLabel || "English";
      targetLanguageLabel.value = s.targetLanguageLabel || "Polski";
      defaultDistractorCount.value = String(s.defaultDistractorCount ?? 4);
      defaultDistractorMode.value = s.defaultDistractorMode || "auto";
      punctuationMode.value = s.punctuationMode || "auto";

      sets = Array.isArray(data.sets) ? data.sets.map(set => {
        const buildMode = set.buildMode === "letters" ? "letters" : "words";
        let distractorMode = set.distractorMode || s.defaultDistractorMode || "auto";
        if(buildMode === "words" && distractorMode === "lettersOnly"){
          distractorMode = "auto";
        }
        return {
          id: sanitizeId(set.id || ""),
          name: cleanText(set.name || ""),
          classLabel: cleanText(set.classLabel || ""),
          theme: cleanText(set.theme || ""),
          buildMode,
          useOwnDistractors: set.useOwnDistractors === true,
          distractorCount: Number(set.distractorCount ?? (s.defaultDistractorCount ?? 4)),
          distractorMode,
          pairs: Array.isArray(set.pairs)
            ? set.pairs.map(pair => ({
                source: cleanText(pair.source || ""),
                target: cleanText(pair.target || "")
              }))
            : []
        };
      }) : [];

      renderSets();
      updateJsonPreview();
      updateNewSetOwnFieldsState();
      applyStaticTranslations();
    }

    function downloadJsonFile(filename, content){
      const blob = new Blob([content], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function copyJson(){
      if(!jsonOutput.value.trim()) updateJsonPreview();
      if(!jsonOutput.value.trim()) return;
      try{
        await navigator.clipboard.writeText(jsonOutput.value);
        setMessage(t("json_copied"), "ok");
      }catch{
        jsonOutput.select();
        document.execCommand("copy");
        setMessage(t("json_copied"), "ok");
      }
    }

    async function loadSentencesJsonAtStart(){
      try{
        const response = await fetch("sentences.json", { cache: "no-store" });
        if(!response.ok) throw new Error("No file");
        const data = await response.json();
        if(!data || !Array.isArray(data.sets)) throw new Error("Invalid JSON");
        applyData(data);
        setMessage(t("loaded_json_ok"), "ok");
      } catch(error){
        console.error(error);
        applyData({
          title: "Translation Game",
          settings: {
            difficulty: "medium",
            defaultClassLabel: "5A",
            spawnRate: 1100,
            timerSeconds: 45,
            maxMistakes: 5,
            randomOrder: false,
            autoNextSeconds: 3,
            soundEnabled: true,
            studentNameMode: true,
            showSetPicker: true,
            allowHint: true,
            allowSolution: false,
            showTranslationInstruction: true,
            sourceLanguageLabel: "English",
            targetLanguageLabel: "Polski",
            defaultDistractorCount: 4,
            defaultDistractorMode: "auto",
            punctuationMode: "auto"
          },
          sets: [
            {
              id: "animals_words",
              name: "Animals - words",
              classLabel: "5A",
              theme: "animals",
              buildMode: "words",
              useOwnDistractors: true,
              distractorCount: 4,
              distractorMode: "material",
              pairs: [
                { source: "Cat", target: "Kot" },
                { source: "Dog", target: "Pies" }
              ]
            }
          ]
        });
        setMessage(t("loaded_json_fallback"), "err");
      }
    }

    addSetBtn.addEventListener("click", () => {
      const id = newSetId.value;
      const name = newSetName.value;
      const classLabel = newSetClassLabel.value;
      const theme = newSetTheme.value;
      const buildMode = newSetBuildMode.value;
      const useOwnDistractors = newSetUseOwnDistractors.value === "true";
      const distractorCount = newSetDistractorCount.value;
      let distractorMode = newSetDistractorMode.value;
      const pairs = parsePairsFromTextarea(newSetPairs.value);

      if(buildMode === "words" && distractorMode === "lettersOnly") distractorMode = "auto";

      if(!sanitizeId(id) || !cleanText(name)){
        setMessage(t("enter_set_id_and_name"), "err");
        return;
      }
      if(pairs.length === 0){
        setMessage(t("add_at_least_one_pair"), "err");
        return;
      }

      addSet(id, name, classLabel, theme, buildMode, useOwnDistractors, distractorCount, distractorMode, pairs);
      setMessage(t("set_added"), "ok");
    });

    clearNewSetBtn.addEventListener("click", () => {
      newSetId.value = "";
      newSetName.value = "";
      newSetClassLabel.value = "";
      newSetTheme.value = "";
      newSetPairs.value = "";
      newSetBuildMode.value = "words";
      newSetUseOwnDistractors.value = "false";
      newSetDistractorCount.value = "4";
      newSetDistractorMode.value = "auto";
      updateNewSetOwnFieldsState();
      setMessage(t("fields_cleared"), "info");
    });

    addEmptySetBtn.addEventListener("click", () => {
      sets.push({
        id: "new_set",
        name: currentLang === "ja" ? "新しいセット" : currentLang === "pl" ? "Nowy zestaw" : "New set",
        classLabel: "",
        theme: "",
        buildMode: "words",
        useOwnDistractors: false,
        distractorCount: 4,
        distractorMode: "auto",
        pairs: []
      });
      renderSets();
      updateJsonPreview();
    });

    sortSetsBtn.addEventListener("click", () => {
      sets.sort((a, b) => String(a.name).localeCompare(String(b.name), currentLang === "ja" ? "ja" : currentLang === "pl" ? "pl" : "en"));
      renderSets();
      updateJsonPreview();
      setMessage(t("sets_sorted"), "ok");
    });

    clearSetsBtn.addEventListener("click", () => {
      sets = [];
      renderSets();
      updateJsonPreview();
      setMessage(t("sets_removed"), "info");
    });

    swapAllLanguagesBtn.addEventListener("click", swapLanguagesInAllSets);
    filterClassLabel.addEventListener("input", renderSets);
    filterTheme.addEventListener("input", renderSets);

    clearFiltersBtn.addEventListener("click", () => {
      filterClassLabel.value = "";
      filterTheme.value = "";
      renderSets();
    });

    previewBtn.addEventListener("click", () => {
      updateJsonPreview();
      if(jsonOutput.value.trim()) setMessage(t("json_refreshed"), "ok");
    });

    downloadBtn.addEventListener("click", () => {
      updateJsonPreview();
      if(!jsonOutput.value.trim()) return;
      downloadJsonFile("sentences.json", jsonOutput.value);
      setMessage(t("json_downloaded"), "ok");
    });

    copyBtn.addEventListener("click", copyJson);
    importBtn.addEventListener("click", () => importFile.click());

    newSetUseOwnDistractors.addEventListener("change", updateNewSetOwnFieldsState);
    newSetBuildMode.addEventListener("change", updateNewSetOwnFieldsState);

    importFile.addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if(!file) return;

      try{
        const text = await file.text();
        const data = JSON.parse(text);
        if(!data || !Array.isArray(data.sets)) throw new Error("Invalid file.");
        applyData(data);
        setMessage(t("json_imported"), "ok");
      }catch(error){
        console.error(error);
        setMessage(t("json_import_error"), "err");
      }finally{
        importFile.value = "";
      }
    });

    applyStaticTranslations();
    loadSentencesJsonAtStart();
    updateNewSetOwnFieldsState();
  </script>
</body>
</html>
